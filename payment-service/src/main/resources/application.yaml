spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false          # overridden to true in local profile only
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}       # default if not set
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Where Spring fetches the public keys to verify token signatures.
          # In prod: your auth server's JWKS endpoint (Keycloak, Auth0, etc.)
          # For local dev: overridden in application-dev.yaml with a static key
          jwks-uri: ${JWT_JWKS_URI}
          # Audience claim your tokens must carry (rejects tokens not meant for this service)
          audiences: ${JWT_AUDIENCE:payment-service}

server:
  port: ${SERVER_PORT:8083}

# Actuator — expose health and info only; never expose env or configprops in prod
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false   # prevents /actuator/info from leaking env vars