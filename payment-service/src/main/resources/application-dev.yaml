# Local development profile — used only when SPRING_PROFILES_ACTIVE=local
# Values here match docker-compose.yml defaults so the project works out of the box.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments?options=-c%20timezone=Asia/Kolkata
    username: username
    password: password

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: username
    password: password
    virtual-host: /

  security:
    oauth2:
      resourceserver:
        jwt:
          # Static public key for local dev — no Keycloak needed.
          # Generate once with: openssl genrsa -out private.pem 2048
          #                     openssl rsa -in private.pem -pubout -out public.pem
          public-key-location: classpath:keys/dev-public.pem

server:
  port: 8083